name: Docs

on:
  push:
    branches: [main]
    paths: ["**.md", ".markdownlint-cli2.jsonc", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md", ".markdownlint-cli2.jsonc", ".github/workflows/docs.yml"]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Markdown style
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Relative links and #anchors on every PR; external links too on the weekly run.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --include-fragments
            ${{ github.event_name != 'schedule' && '--offline' || '' }}
            --exclude-path node_modules
            './**/*.md'
          fail: true
