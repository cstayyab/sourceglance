name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Validate GSettings schema
        run: |
          sudo apt-get update && sudo apt-get install -y libglib2.0-bin
          glib-compile-schemas --strict --dry-run src/schemas

  setup-wizard:
    runs-on: ubuntu-24.04   # GNOME Shell 46: the oldest supported release
    # Normally about a minute; a stuck mirror shouldn't hold a PR for half an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GNOME Shell, GJS and build tools
        # The download is about 130 MB, under a minute from a healthy mirror. Some mirrors
        # crawl (about 70 kB/s on 2026-11-18, 31 minutes): give up after 4 minutes and try
        # again from another mirror (the runner's list in apt-mirrors.txt), keeping what's
        # already downloaded.
        run: |
          mirrors=("" "http://azure.archive.ubuntu.com/ubuntu/" "http://archive.ubuntu.com/ubuntu/")
          sudo apt-get update
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get install -y --no-install-recommends gjs gnome-shell \
              gir1.2-secret-1 libglib2.0-bin squashfs-tools dconf-cli; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            next=${mirrors[$attempt]}
            echo "::warning::apt-get install was slow or failed (attempt $attempt); trying $next"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "$next" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            else
              sudo sed -i "s|http://[^ ]*archive.ubuntu.com/ubuntu/\?|$next|" /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            fi
            sudo apt-get update
          done
      - name: Command-line install, upgrade, repair and remove
        run: make setup-test
      - name: Build the AppImage and run it
        run: |
          ARCHES=x86_64 make setup
          app=$(ls dist/sourceglance-Setup-*-x86_64.AppImage)
          "$app" --appimage-extract-and-run --version
          GSETTINGS_BACKEND=memory "$app" --appimage-extract-and-run --check
