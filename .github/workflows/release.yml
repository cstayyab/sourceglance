name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write      # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches metadata.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta=$(jq -r '."version-name"' src/metadata.json)
          if [ "$tag" != "$meta" ]; then
            echo "Tag v$tag does not match version-name $meta in src/metadata.json" >&2
            exit 1
          fi

      - name: Build extension zip
        run: make pack

      - name: Build setup wizard AppImages
        run: |
          sudo apt-get update && sudo apt-get install -y squashfs-tools libglib2.0-bin
          make setup

      - name: Checksums
        run: cd dist && sha256sum *.zip *.AppImage > SHA256SUMS && cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.AppImage

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $version" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.AppImage dist/SHA256SUMS \
            --title "sourceglance $GITHUB_REF_NAME" \
            --notes-file release-notes.md $prerelease
