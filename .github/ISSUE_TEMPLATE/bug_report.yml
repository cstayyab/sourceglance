name: Bug report
description: Something is broken or doesn't work as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/omer-gh/sourceglance/issues) first.
        **Security problem?** Don't file it here — follow [SECURITY.md](https://github.com/omer-gh/sourceglance/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click the sourceglance icon
        2. Open Settings
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sourceglance version
      description: Shown in the extension's Settings → About, or in metadata.json.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ubuntu
    attributes:
      label: Ubuntu version
      description: Output of `lsb_release -ds`
      placeholder: "Ubuntu 24.04.3 LTS"
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`
      placeholder: "GNOME Shell 46.0"
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      options:
        - Wayland
        - X11
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Output of `journalctl -o cat /usr/bin/gnome-shell --since "10 minutes ago" | grep -i sourceglance`.
        **Remove any tokens before pasting.**
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed any tokens or personal data from this report.
          required: true
